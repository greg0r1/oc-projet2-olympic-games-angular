<div class="page-grid">
  @switch (status) {
    @case ('success') {
      <app-header
        [indicators]="indicators"
        [pageTitle]="titlePage">
      </app-header>
      <p class="intro">{{ introText }}</p>
      <app-pie-chart
        (itemSelected)="onCountrySelected($event)"
        [items]="chartItems"
      ></app-pie-chart>
    }
    @case ('loading') {
      <app-status-message status="loading"></app-status-message>
    }
    @case ('empty') {
      <app-status-message status="empty"></app-status-message>
    }
    @case ('error') {
      <app-status-message [message]="error" status="error"></app-status-message>
      <div class="actions">
        <button (click)="reload()" class="retry" type="button">Try again</button>
      </div>
    }
  }
</div>
