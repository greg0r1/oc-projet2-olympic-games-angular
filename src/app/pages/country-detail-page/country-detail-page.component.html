<div class="page-grid">
  @switch (status) {
    @case ('success') {
      <app-header
        [indicators]="indicators"
        [pageTitle]="titlePage">
      </app-header>
      <div class="chart">
        <app-line-chart
          [labels]="years"
          [values]="medals"
        ></app-line-chart>
        <p class="axis-label">Dates</p>
      </div>
    }
    @case ('loading') {
      <app-status-message status="loading"></app-status-message>
    }
    @case ('empty') {
      <app-status-message status="empty"></app-status-message>
    }
    @case ('error') {
      <app-status-message [message]="error" status="error"></app-status-message>
    }
  }
  <div class="center">
    <a [routerLink]="homeLink">Go back</a>
  </div>
</div>
